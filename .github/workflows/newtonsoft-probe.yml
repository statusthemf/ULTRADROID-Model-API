
name: Build Newtonsoft Runtime Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'test/NewtonsoftTest/**'
      - 'lib/**'
      - '.github/workflows/newtonsoft-probe.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        run: dotnet build test/NewtonsoftTest/NewtonsoftTest.csproj --configuration Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NewtonsoftProbe
          path: test/NewtonsoftTest/bin/Release/net6.0/NewtonsoftProbe.dll
