
name: Build ULTRADROID Models API and Test

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "lib/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "lib/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check required game references
        shell: bash
        run: |
          set -e

          for file in \
            lib/BepInEx.Core.dll \
            lib/BepInEx.Unity.IL2CPP.dll \
            lib/Il2CppInterop.Runtime.dll \
            lib/Il2Cppmscorlib.dll \
            lib/UnityEngine.CoreModule.dll \
            lib/UnityEngine.PhysicsModule.dll
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing reference: $file"
              exit 1
            fi
          done

      - name: Restore Models API
        run: dotnet restore src/ULTRADROID.Models.csproj

      - name: Build Models API
        run: dotnet build src/ULTRADROID.Models.csproj --configuration Release --no-restore

      - name: Restore test plugin
        run: dotnet restore test/ULTRADROID.Models.Test/ULTRADROID.Models.Test.csproj

      - name: Build test plugin
        run: dotnet build test/ULTRADROID.Models.Test/ULTRADROID.Models.Test.csproj --configuration Release

      - name: Upload Models API DLL
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID.Models.dll
          path: src/bin/Release/net10.0/ULTRADROID.Models.dll
          if-no-files-found: error
          compression-level: 0

      - name: Upload test plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID.Models.Test.dll
          path: test/ULTRADROID.Models.Test/bin/Release/net10.0/ULTRADROID.Models.Test.dll
          if-no-files-found: error
          compression-level: 0
