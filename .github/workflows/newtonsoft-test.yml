
name: Newtonsoft JSON Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Newtonsoft tests
        run: dotnet run --project test/NewtonsoftTest/NewtonsoftTest.csproj
